[project]
name = "projects-tasks-api"
version = "0.1.0"
description = "Django + DRF JSON API for users, projects and tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework",
    "django-oauth-toolkit",
    "drf-spectacular",
    "dj-database-url",
    "gunicorn",
    "sentry-sdk[django]>=2.74.0",
    "django-cors-headers>=4.9.0",
    "urllib3>=2.8.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-xdist",
    "ruff",
    "jsonschema",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests", "apps"]
addopts = "--strict-markers -m 'not smoke'"
markers = ["smoke: runs bin/local-smoke against a live local server (uv run pytest -m smoke)"]
